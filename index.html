<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WorldRun" />
  <meta name="theme-color" content="#0f1923" />
  <link rel="manifest" href="manifest.json" />
  <title>WorldRun</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1923;
      --surface:   #1a2535;
      --surface2:  #243044;
      --accent:    #00c2ff;
      --accent2:   #00e5a0;
      --warn:      #ff6b6b;
      --text:      #e8f0fe;
      --muted:     #7a92b0;
      --radius:    12px;
      --safe-top:  env(safe-area-inset-top, 0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    /* ── View system ── */
    .view {
      display: none;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bot);
    }
    .view.active { display: flex; }

    /* ── Scrollable content area ── */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
    }

    /* ── Typography helpers ── */
    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    h2 { font-size: 1.1rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    /* ── Topbar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--surface2);
    }
    .topbar .logo { font-size: 1.3rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }

    /* ── Button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: var(--radius);
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:active { opacity: .75; }
    .btn-primary { background: var(--accent); color: #0f1923; }
    .btn-full { width: 100%; }

    /* ── Icon button ── */
    .icon-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      font-size: 1.4rem;
      line-height: 1;
    }
    .icon-btn:active { color: var(--text); }

    /* ── Placeholder content ── */
    .placeholder {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════
     GOALS VIEW
════════════════════════════════════════ -->
<div id="goals-view" class="view">
  <div class="topbar">
    <span class="logo">🌍 WorldRun</span>
  </div>
  <div class="scroll-body">
    <div class="placeholder">
      <h1>Goals</h1>
      <p>Step 2 coming soon…</p>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MAIN VIEW
════════════════════════════════════════ -->
<div id="main-view" class="view">
  <div class="topbar">
    <span class="logo">🌍 WorldRun</span>
    <button class="icon-btn" id="settings-btn" title="Settings">⚙️</button>
  </div>
  <div class="scroll-body">
    <div class="placeholder">
      <h1>Dashboard</h1>
      <p>Step 5 coming soon…</p>
    </div>
  </div>
</div>

<script>
// ── Storage keys ──────────────────────────────────────────────
const KEYS = { goal: 'wr_goal', seeds: 'wr_seeds', runs: 'wr_runs', settings: 'wr_settings' };

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function save(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

// ── Router ────────────────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function init() {
  const goal = load(KEYS.goal);
  if (!goal) {
    showView('goals-view');
  } else {
    showView('main-view');
  }
}

document.getElementById('settings-btn').addEventListener('click', () => showView('goals-view'));

// ── Service worker ────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

init();
</script>
</body>
</html>
